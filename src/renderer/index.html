<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Media Studio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components/login/login.css">

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <!-- MediaPipe Globals -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- Login Portal Overlay (Reference Style) -->
    <div id="login-portal">
        <canvas id="magic-canvas"></canvas>

        <!-- Video Input (Top Right) -->
        <video id="video-input" playsinline></video>

    </div>

    <div id="app" class="app-layout" style="display:none;"> <!-- Hidden initially -->
        <!-- 全局侧边栏容器 -->
        <aside id="app-sidebar"></aside>

        <!-- 主内容区域 -->
        <div id="content-wrapper">
            <!-- 顶部导航栏 (Optional per page) -->
            <!-- <header id="main-header"></header> -->

            <!-- 主体内容 -->
            <main id="main-content"></main>

            <!-- 底部操作栏 -->
            <footer id="main-footer"></footer>
        </div>
    </div>

    <!-- JavaScript 模块 -->
    <!-- JavaScript 模块 -->
    <script src="pages/dashboard/dashboard.js"></script>
    <script src="pages/face-swap/face-swap.js"></script>
    <script src="pages/video-generation/video-generation.js"></script>
    <script src="pages/voice-cloning/voice-cloning.js"></script>
    <script src="pages/assets/assets.js"></script>
    <script src="components/media-preview/media-preview.js"></script>

    <!-- Components -->
    <!-- Components -->
    <script type="module" src="./components/toast.js"></script>
    <script src="./components/sidebar/sidebar.js"></script>

    <!-- Utilities & Core -->
    <script type="module" src="utils/web-api.js"></script>
    <script type="module" src="utils/asset-manager.js"></script>
    <script src="utils/settings-manager.js"></script>
    <script src="app.js"></script>

    <!-- Login Initialization -->
    <script type="module">
        import { LoginManager } from './components/login/login-manager.js';

        // Initialize App Function
        const unlockApp = () => {
            const app = document.getElementById('app');
            console.log("System Unlocked");
            app.style.display = 'flex'; // Reveal App
            app.classList.add('fade-in');

            // Trigger any app init if needed
            if (window.AssetManager) window.AssetManager.refresh();
        };

        // Authentication "Middleware" Selection
        // Scheme 1: Check Server Configuration to decide Auth Strategy
        fetch('/api/config')
            .then(res => res.json())
            .then(config => {
                if (config.debugMode === true) {
                    // Strategy A: Mock Auth (Debug Mode)
                    console.log("[Auth] Debug Environment Detected. Swapping to Mock Authentication.");
                    document.getElementById('login-portal').style.display = 'none';
                    unlockApp();
                } else {
                    // Strategy B: Real Auth (Production Mode)
                    console.log("[Auth] Production Environment. enabling Biometric Lock.");
                    new LoginManager('login-portal', unlockApp);
                }
            })
            .catch(err => {
                // Default to Secure if config fails
                console.error("[Auth] Config check failed. Defaulting to Secure Mode.", err);
                new LoginManager('login-portal', unlockApp);
            });
    </script>
</body>

</html>
