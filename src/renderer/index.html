<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Media Studio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components/login/login.css">
    <link rel="stylesheet" href="components/login/login-form.css">

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "@decartai/sdk": "https://esm.sh/@decartai/sdk"
            }
        }
    </script>
    <!-- MediaPipe Globals -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>


    <!-- Login Portal Overlay (Username/Password) -->
    <div id="login-portal">
        <div class="login-container">
            <h1 class="login-title">AI Media Studio</h1>
            <p class="login-subtitle">Secure Access Portal</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-username" class="form-label">Username</label>
                    <input type="text" id="login-username" class="form-input" placeholder="student"
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="Enter password"
                        autocomplete="current-password">
                </div>

                <div class="error-message" id="login-error"></div>

                <button type="submit" id="login-submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>

    <div id="app" class="app-layout" style="display:none;"> <!-- Hidden initially -->
        <!-- 全局侧边栏容器 -->
        <aside id="app-sidebar"></aside>

        <!-- 主内容区域 -->
        <div id="content-wrapper">
            <!-- Global Utility Bar (Floating) -->
            <div id="global-util-bar">
                <button class="lang-switch-btn" id="main-lang-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path
                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                        </path>
                    </svg>
                    <span id="lang-label">中文</span>
                </button>
            </div>

            <!-- 顶部导航栏 (Optional per page) -->
            <!-- <header id="main-header"></header> -->

            <!-- 主体内容 -->
            <main id="main-content"></main>

            <!-- 底部操作栏 -->
            <footer id="main-footer"></footer>
        </div>
    </div>

    <!-- JavaScript 模块 -->
    <!-- JavaScript 模块 -->
    <!-- JavaScript 模块 -->
    <script type="module" src="pages/dashboard/dashboard.js"></script>
    <script type="module" src="pages/face-swap/face-swap.js"></script>
    <script type="module" src="pages/video-generation/video-generation.js"></script>
    <script type="module" src="pages/voice-cloning/voice-cloning.js"></script>
    <script type="module" src="pages/assets/assets.js"></script>
    <script type="module" src="pages/realtime-vision/realtime-vision.js"></script>
    <script type="module" src="components/media-preview/media-preview.js"></script>

    <!-- Components -->
    <script type="module" src="./components/toast.js"></script>
    <script type="module" src="./components/sidebar/sidebar.js"></script>

    <!-- Utilities & Core -->
    <script type="module" src="utils/i18n.js"></script>
    <script type="module" src="utils/web-api.js"></script>
    <script type="module" src="utils/asset-manager.js"></script>
    <script type="module" src="utils/settings-manager.js"></script>
    <script type="module" src="app.js"></script>

    <!-- Login Initialization -->
    <script type="module">
        import { LoginManager } from './components/login/login-manager.js';
        import i18n from './utils/i18n.js';
        import ThemeManager from './utils/theme-manager.js';

        // Initialize Theme
        ThemeManager.init();

        // Initialize App Function
        const unlockApp = () => {
            const app = document.getElementById('app');
            console.log("System Unlocked");
            app.style.display = 'flex'; // Reveal App
            app.classList.add('fade-in');

            // Trigger any app init if needed
            if (window.AssetManager) window.AssetManager.refresh();
        };

        // Initialize i18n and then start app logic
        await i18n.init();
        console.log("i18n initialized with:", i18n.lang);
        document.title = i18n.t('APP_TITLE');

        // Start High-level UI logic
        if (window.initializeApp) window.initializeApp();

        // Update Language Switcher UI
        const langLabel = document.getElementById('lang-label');
        const langToggle = document.getElementById('main-lang-toggle');

        const updateLangUI = (lang) => {
            if (langLabel) langLabel.innerText = lang === 'zh' ? 'English' : '中文';
        };

        updateLangUI(i18n.lang);

        if (langToggle) {
            langToggle.onclick = () => {
                const newLang = i18n.lang === 'zh' ? 'en' : 'zh';
                i18n.switchLanguage(newLang);
            };
        }

        window.addEventListener('language-changed', (e) => {
            updateLangUI(e.detail.lang);
        });

        // Authentication "Middleware" Selection
        // Scheme 1: Check Server Configuration to decide Auth Strategy
        fetch('/api/config')
            .then(res => res.json())
            .then(config => {
                if (config.debugMode === true) {
                    // Strategy A: Mock Auth (Debug Mode - Auto Login)
                    console.log("[Auth] Debug Environment Detected. Swapping to Mock Authentication.");
                    document.getElementById('login-portal').style.display = 'none';
                    unlockApp();
                } else {
                    // Strategy B: Real Auth (Production Mode)
                    console.log("[Auth] Production Environment. Enabling Login Form.");
                    new LoginManager('login-portal', unlockApp);
                }
            })
            .catch(err => {
                // Default to Secure if config fails
                console.error("[Auth] Config check failed. Defaulting to Secure Mode.", err);
                new LoginManager('login-portal', unlockApp);
            });
    </script>
</body>

</html>
