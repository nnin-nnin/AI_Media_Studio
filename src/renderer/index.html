<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Media Studio</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">

    <!-- Import Map for SDKs -->
    <script type="importmap">
        {
            "imports": {
                "@decartai/sdk": "https://esm.sh/@decartai/sdk"
            }
        }
    </script>
</head>

<body>

    <div id="app" class="app-layout"> <!-- Always visible -->
        <!-- 全局侧边栏容器 -->
        <aside id="app-sidebar"></aside>

        <!-- 主内容区域 -->
        <div id="content-wrapper">
            <!-- Global Utility Bar (Floating) -->
            <div id="global-util-bar">
                <button class="lang-switch-btn" id="main-lang-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path
                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                        </path>
                    </svg>
                    <span id="lang-label">中文</span>
                </button>
            </div>

            <!-- 主体内容 -->
            <main id="main-content"></main>

            <!-- 底部操作栏 -->
            <footer id="main-footer"></footer>
        </div>
    </div>

    <!-- JavaScript 模块 -->
    <script type="module" src="pages/dashboard/dashboard.js"></script>
    <script type="module" src="pages/face-swap/face-swap.js"></script>
    <script type="module" src="pages/video-generation/video-generation.js"></script>
    <script type="module" src="pages/voice-cloning/voice-cloning.js"></script>
    <script type="module" src="pages/assets/assets.js"></script>
    <script type="module" src="pages/voice-chat/voice-chat.js"></script>
    <script type="module" src="pages/realtime-vision/realtime-vision.js"></script>
    <script type="module" src="components/media-preview/media-preview.js"></script>

    <!-- Components -->
    <script type="module" src="./components/toast.js"></script>
    <script type="module" src="./components/api-config-modal.js"></script>
    <script type="module" src="./components/sidebar/sidebar.js"></script>

    <!-- Utilities & Core -->
    <script type="module" src="utils/i18n.js"></script>
    <script type="module" src="utils/web-api.js"></script>
    <script type="module" src="utils/local-cache.js"></script>
    <script type="module" src="utils/asset-manager.js"></script>
    <script type="module" src="utils/settings-manager.js"></script>
    <script type="module" src="app.js"></script>

    <!-- Login Initialization -->
    <script type="module">
        import i18n from './utils/i18n.js';
        import ThemeManager from './utils/theme-manager.js';

        // Initialize Theme
        ThemeManager.init();

        // Initialize i18n and then start app logic
        await i18n.init();
        console.log("i18n initialized with:", i18n.lang);
        document.title = i18n.t('APP_TITLE');

        // Start High-level UI logic
        if (window.initializeApp) window.initializeApp();

        // Reveal App with fade-in
        const app = document.getElementById('app');
        if (app) app.classList.add('fade-in');

        // Trigger any app init if needed
        if (window.AssetManager) window.AssetManager.refresh();
        if (window.ApiConfigModal) window.ApiConfigModal.checkFirstRun();

        // Update Language Switcher UI
        const langLabel = document.getElementById('lang-label');
        const langToggle = document.getElementById('main-lang-toggle');

        const updateLangUI = (lang) => {
            if (langLabel) langLabel.innerText = lang === 'zh' ? 'English' : '中文';
        };

        updateLangUI(i18n.lang);

        if (langToggle) {
            langToggle.onclick = () => {
                const newLang = i18n.lang === 'zh' ? 'en' : 'zh';
                i18n.switchLanguage(newLang);
            };
        }

        window.addEventListener('language-changed', (e) => {
            updateLangUI(e.detail.lang);
        });
    </script>
</body>

</html>
